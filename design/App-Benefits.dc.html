<x-dc>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7F9; color: #16181F; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; position: relative; overflow: hidden">
  <div style="padding: 20px 20px 104px; display: flex; flex-direction: column; gap: 12px">

          <span style="font-weight: 600">{{r.name}}</span>
          <span style="text-align: center; color: #1F2B4D; font-weight: 600">{{r.p}}</span>
          <span style="text-align: center; color: #5E6472">{{r.b}}</span>
        </div>
      </sc-for>
    </div>

    <div style="background: #1F2B4D; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; color: #FFFFFF">
      <div style="font-size: 15px; font-weight: 700">이미 [제휴 결정사] 회원이세요?</div>

        <a href="App-Home-Private.dc.html" style="height: 44px; border-radius: 11px; border: 1px solid rgba(255,255,255,0.3); color: #FFFFFF; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">상담 신청</a>
      </div>
    </div>
  </div>

  <nav aria-label="하단 메뉴" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-top: 1px solid #E6E8EE; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-bottom: 18px; box-sizing: border-box">
    <a href="App-Home-Private.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #6B7180; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>홈</a>
    <a href="App-Explore.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #6B7180; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>탐색</a>
    <a href="App-Matches.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #6B7180; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.35-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.65-7 10-7 10z"/></svg>매칭</a>
    <a href="App-Benefits.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 700; color: #1F2B4D; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6z"/><path d="m9 12 2 2 4-4"/></svg>혜택</a>
